<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixelnotic Interactive</title>

    <style>
        body {
            background: #0b0f14;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }

        .hero-logo {
            display: block;
            margin: 0 auto 20px auto;
            max-width: 900px;
            width: 100%;
            height: auto;
            border-radius: 12px;
        }

        .logo {
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 10px;

            background: linear-gradient(
                90deg,
                #00ffff,
                #00ff88,
                #ffff00,
                #ff66ff,
                #00ffff
            );

            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: wave 6s linear infinite;
        }

        @keyframes wave {
            0% {
                background-position: 0% 50%;
            }

            100% {
                background-position: 300% 50%;
            }
        }

        .subtitle {
            color: #d0d0d0;
            font-size: 1.3rem;
            margin-bottom: 40px;
        }

        .projects-title {
            color: #00ffff;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .projects {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 60px;
        }

        .project {
            min-width: 180px;
        }

        .project-name {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .coming-soon {
            color: #999;
            font-size: 0.95rem;
        }

        .footer {
            margin-top: 50px;
            color: #777;
        }

        @media (max-width: 768px) {
            .logo {
                font-size: 2.5rem;
            }

            .projects {
                flex-direction: column;
                gap: 30px;
            }
        }
    </style>
</head>
<body>

    <img
        src="pixelnotic-logo.jpg"
        alt="Pixelnotic Interactive Logo"
        class="hero-logo"
    >

    <h1 class="logo">Pixelnotic Interactive</h1>

    <p class="subtitle">
        Independent Game Development Studio
    </p>

    <div class="projects-title">
        Current Projects
    </div>

    <div class="projects">

        <div class="project">
            <div class="project-name">Pulse Drift</div>
            <div class="coming-soon">Play Now Coming Soon</div>
        </div>

        <div class="project">
            <div class="project-name">Toad Rage</div>
            <div class="coming-soon">Play Now Coming Soon</div>
        </div>

        <div class="project">
            <div class="project-name">Jumpy Bro</div>
            <div class="coming-soon">Play Now Coming Soon</div>
        </div>

    </div>

    <div class="footer">
        Website under construction.
    </div>

</body>
</html>
